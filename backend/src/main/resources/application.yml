spring:
  application:
    name: construction-contracts
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    enabled: false
